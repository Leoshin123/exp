<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LZ - Películas</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <style>
    body { background: #121212; color: white; }
    nav { box-shadow: none; }
    .brand-logo { font-weight: bold; }
    .sidenav { background: #1c1c1c; }
    .sidenav li>a { color: #e0e0e0; font-weight: 600; }
    .sidenav li>a.active-sidenav { background: rgba(60,128,85,.2); color: #20bf6b; }
    .banner { display: flex; align-items: center; padding: 15px; background: #181818; }
    .banner img { border-radius: 50%; width: 64px; height: 64px; }
    .banner h4 { margin-left: 10px; }

    /* Buscador */
    .containerb { position: absolute; right: 15px; top: 10px; width: 50px; height: 50px; }
    .containerb input {
      position: absolute; width: 50px; height: 50px;
      background: crimson; color: white;
      border: none; border-radius: 50%;
      padding: 0 20px; transition: all 0.5s; opacity: 0;
    }
    .containerb input:focus {
      width: 250px; opacity: 1; border-radius: 5px; background: #333;
    }
    .containerb .search {
      width: 50px; height: 50px; background: crimson;
      border-radius: 50%; display: flex; align-items: center;
      justify-content: center; cursor: pointer; z-index: 2;
    }
    .containerb .search i { color: white; }

    /* Películas */
    .padDrew { padding: 20px 10px; }
    .col img { width: 100%; border-radius: 6px; }
    .tabs .tab a { font-weight: 600; }
    .each-category span { display: none; }
    .carousel-item ul { display: flex; gap: 10px; overflow-x: auto; padding: 10px; }
    .carousel-item ul li { flex: 0 0 auto; width: 160px; }
    .carousel { height: auto; }
    .animation { animation: fadeIn 0.4s ease-in; }
    @keyframes fadeIn { from {opacity:0; transform:scale(.9);} to {opacity:1; transform:scale(1);} }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar-fixed">
    <nav class="black">
      <div class="nav-wrapper">
        <a href="#" class="brand-logo">LZ</a>
        <a href="#" data-target="mobile-demo" class="sidenav-trigger"><i class="material-icons">menu</i></a>

        <ul id="nav-mobile" class="right hide-on-med-and-down">
          <li><a class="active-sidenav" href="#!">Películas</a></li>
          <li><a href="go:seriehome">Series</a></li>
          <li><a href="#!">Novelas</a></li>
        </ul>

        <!-- Buscador -->
        <div class="containerb">
          <input type="text" id="buscar" placeholder="Buscar..." onkeyup="buscarPeliculas()">
          <div class="search" onclick="document.getElementById('buscar').focus();">
            <i class="material-icons">search</i>
          </div>
        </div>
      </div>

      <div class="nav-content">
        <ul class="tabs tabs-transparent" id="genre-tabs"></ul>
      </div>
    </nav>
  </div>

  <!-- Sidenav -->
  <ul class="sidenav" id="mobile-demo">
    <li class="banner">
      <img src="https://plantillasplus.com/wp-content/uploads/2024/06/nuevologotipo-pp-150x150.png">
      <h4>LZ</h4>
    </li>
    <li><a class="active-sidenav" href="#!"><i class="material-icons">movie</i> Películas</a></li>
    <li><a href="go:seriehome"><i class="material-icons">live_tv</i> Series</a></li>
    <li><a href="#!"><i class="material-icons">theaters</i> Novelas</a></li>
  </ul>

  <!-- Contenido -->
  <div class="each-category">
    <div id="carousel-container"></div>
    <ul id="busquedas" class="row padDrew" style="display:none">
      <li>
        <a href="go:peli" class="col s4 m3 l2">
          <img src="https://image.tmdb.org/t/p/w500//9TFSqghEHrlBMRR63yTx80Orxva.jpg">
          <span class="titulo">Deadpool y Wolverine</span>
          <span class="generos">Acción, Comedia, Aventura</span>
        </a>
      </li>
      <li>
        <a href="go:peli2" class="col s4 m3 l2">
          <img src="https://image.tmdb.org/t/p/w500//pA3vdhadJPxF5GA1uo8OPTiNQDT.jpg">
          <span class="titulo">Duna: Parte 2</span>
          <span class="generos">Ciencia Ficción, Aventura</span>
        </a>
      </li>
      <li>
        <a href="go:peli3" class="col s4 m3 l2">
          <img src="https://image.tmdb.org/t/p/w500//1E5baAaEse26fej7uHcjOgEE2t2.jpg">
          <span class="titulo">Godzilla Minus One</span>
          <span class="generos">Acción, Drama, Ciencia Ficción</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      M.AutoInit();
      generarCarruseles();
    });

    // Genera un carrusel por cada género automáticamente
    function generarCarruseles() {
      const lista = document.querySelectorAll('#busquedas li');
      const generos = new Set();
      lista.forEach(li => {
        const gs = li.querySelector('.generos').textContent.split(',');
        gs.forEach(g => generos.add(g.trim()));
      });

      const contenedor = document.getElementById('carousel-container');
      contenedor.innerHTML = '';

      generos.forEach(genre => {
        const seccion = document.createElement('div');
        seccion.className = 'section';

        const titulo = document.createElement('h5');
        titulo.textContent = genre;
        titulo.style.marginLeft = '15px';
        seccion.appendChild(titulo);

        const carousel = document.createElement('div');
        carousel.className = 'carousel';
        seccion.appendChild(carousel);

        lista.forEach(li => {
          const gs = li.querySelector('.generos').textContent;
          if (gs.includes(genre)) {
            const clone = li.cloneNode(true);
            const div = document.createElement('div');
            div.className = 'carousel-item';
            div.appendChild(clone.querySelector('a'));
            carousel.appendChild(div);
          }
        });

        contenedor.appendChild(seccion);
        // Esperar un momento antes de inicializar cada carrusel
        setTimeout(() => {
          M.Carousel.init(carousel, {
            fullWidth: false,
            indicators: false,
            numVisible: 5,
            dist: -50,
            padding: 10
          });
        }, 100);
      });
    }

    // Búsqueda
    function buscarPeliculas() {
      const filtro = document.getElementById('buscar').value.toUpperCase();
      const secciones = document.querySelectorAll('.carousel-item a');
      secciones.forEach(a => {
        const txt = a.textContent.toUpperCase();
        a.parentElement.style.display = txt.includes(filtro) ? '' : 'none';
      });
    }
  </script>
</body>
</html>
